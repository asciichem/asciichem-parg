name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # Pinned to the version the grammar was validated against; bump
      # deliberately with a re-run of the acceptance suite.
      - run: gem install parsanol -v 1.3.94
      - name: Grammar acceptance suite (compile + inline tests)
        run: parsanol parg test grammar/asciichem.parg
